name: Bug report
description: Something wrong with jevcache (install, HIT/MISS, crashes)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough to reproduce — especially install method and whether `/healthz` works.

        **Wrong HIT / stale reuse?** Include `X-Jevcache-*` headers and whether `JEVCACHE_SHADOW=1` was on.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of issue?
      options:
        - Wrong HIT / false same-intent
        - Stale answer reused (freshness)
        - Install / start / doctor
        - Crash / other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Expected MISS → HIT but got two MISSes / crash on start / …
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install / run?
      options:
        - npx @kushalicious/jevcache
        - Docker / ghcr.io
        - From source (git clone)
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      placeholder: |
        1. npx @kushalicious/jevcache start --demo
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 0.3.0 or git SHA
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.x
  - type: textarea
    id: logs
    attributes:
      label: Logs / headers
      description: Paste X-Jevcache headers, doctor --live output, or crash stack (redact keys).
