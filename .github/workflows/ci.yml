name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
        env:
          NODE_OPTIONS: --experimental-sqlite
      - run: npm test
        env:
          NODE_OPTIONS: --experimental-sqlite
      - run: npm run eval
        env:
          NODE_OPTIONS: --experimental-sqlite
      - run: npm run build
